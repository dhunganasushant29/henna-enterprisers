# Builds the static site and publishes it to GitHub Pages on every push to main.
# Live at https://dhunganasushant29.github.io/henna-enterprisers/
#
# Custom domain later (e.g. www.hennaconsultants.com): set NEXT_PUBLIC_BASE_PATH to ""
# and NEXT_PUBLIC_SITE_URL to the domain below, then add the domain in Settings → Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /henna-enterprisers
          NEXT_PUBLIC_SITE_URL: https://dhunganasushant29.github.io/henna-enterprisers
          # Contact form (EmailJS). Add these under Settings → Secrets and variables → Actions.
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_SERVICE_ID }}
          NEXT_PUBLIC_EMAILJS_TEMPLATE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_TEMPLATE_ID }}
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_EMAILJS_PUBLIC_KEY }}

      # Serve folders that start with "_" (Next puts its files in _next/)
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
